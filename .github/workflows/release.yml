name: Release

# Tag a version (git tag v1.0.0 && git push origin v1.0.0) and a Windows
# runner builds the installer and attaches it to the release. Run it manually
# from the Actions tab to get an unpublished build to test.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # for build provenance attestation
  attestations: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # history, for the release notes fallback
          fetch-tags: true  # and the annotated tag objects themselves

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Freeze the pipeline
        run: pyinstaller pipeline.spec --noconfirm

      - name: Smoke-test the frozen pipeline
        shell: pwsh
        env:
          PAPERSTUDY_DIR: ${{ runner.temp }}/PaperStudy
        run: |
          $out = & dist\pipeline\study_api.exe settings | ConvertFrom-Json
          if (-not $out.settings.model) { throw "study_api.exe didn't return settings" }
          "settings OK: model $($out.settings.model)"
          $library = & dist\pipeline\study_api.exe library | ConvertFrom-Json
          if ($null -eq $library.stats) { throw "study_api.exe didn't return a library" }
          "library OK: $($library.stats.papers) paper(s) in a fresh folder"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          npm version --no-git-tag-version --allow-same-version $version

      - name: Build the installer
        working-directory: app
        env:
          # electron-builder signs automatically when these are set. Add the
          # repo secrets once a code-signing certificate exists; until then
          # the build is simply unsigned.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: Smoke-test the packaged app
        shell: pwsh
        env:
          PAPERSTUDY_DIR: ${{ runner.temp }}/PaperStudy
        run: |
          $exe = "release\win-unpacked\DoTheReading.exe"
          if (-not (Test-Path $exe)) { throw "packaged app not found at $exe" }
          $result = "$env:RUNNER_TEMP\selftest.json"
          $env:DTR_SELFTEST = $result
          & $exe | Out-Null
          if (-not (Test-Path $result)) { throw "the packaged app wrote no self-test result" }
          $check = Get-Content $result | ConvertFrom-Json
          "self-test: $(Get-Content $result)"
          if (-not $check.ok) { throw "packaged app self-test failed: $($check.error)" }
          if (-not $check.packaged) { throw "self-test didn't run against the packaged build" }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release\SHA256SUMS.txt
          Get-Content release\SHA256SUMS.txt

      # Signed, verifiable proof of which workflow run built the installer:
      #   gh attestation verify DoTheReading-Setup-x.y.z.exe -R lhmartin/DoTheReading
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: DoTheReading-installer
          path: release/*.exe

      # The annotated tag's message is the release notes: written per release,
      # not boilerplate. Falls back to the commit subjects since the last tag.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # checkout leaves a lightweight ref, so the annotated tag object —
          # which holds the notes — has to be fetched explicitly. Without
          # this, %(contents:body) silently returns the commit message.
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          notes=$(git for-each-ref "refs/tags/${{ github.ref_name }}" --format='%(contents:body)')
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            previous=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
            range=${previous:+$previous..}${{ github.ref_name }}
            notes=$(git log --no-merges --format='- %s' "$range")
          fi
          {
            echo "NOTES<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_ENV"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          body: |
            ## What's new

            ${{ env.NOTES }}

            ---

            **DoTheReading** — download `DoTheReading-Setup-*.exe` below.

            The installer contains the app and the whole Python pipeline, so
            no Python install is needed. On first run the app's Settings tab
            checks for Ollama and offers to download a model (the model is a
            separate ~14 GB download; a smaller one can be chosen there).

            **Windows will warn you**: the installer isn't code-signed, so
            SmartScreen shows "Windows protected your PC" — choose
            More info → Run anyway.

            To check you got what this workflow built:

            ```
            gh attestation verify DoTheReading-Setup-*.exe -R lhmartin/DoTheReading
            ```

            or compare against `SHA256SUMS.txt`:

            ```powershell
            Get-FileHash .\DoTheReading-Setup-*.exe -Algorithm SHA256
            ```
